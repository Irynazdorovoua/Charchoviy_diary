<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F9EFF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Щоденник">
<title>Розквітай · Харчовий щоденник · 3 дні</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F9EFF0; --ink:#3D2733; --ink-soft:#7A6270;
    --rose:#B4566C; --rose-soft:#E7C3CC; --line:#F0E2E6;
    --sage:#7C9082; --gold:#C9A227; --wheat:#C9A45C; --blue:#7A87A8;
    --card:#FFFFFF; --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
  button,input,textarea{font-family:'Manrope',system-ui,sans-serif}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .app{max-width:460px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);font-weight:700;text-align:center}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;text-align:center;margin:4px 0 2px;line-height:1.15}
  .sub{text-align:center;color:var(--ink-soft);font-size:13.5px;max-width:330px;margin:0 auto}
  .flower-wrap{display:flex;justify-content:center;margin:12px 0 4px}
  .petal{fill:#EFDCE1}.petal.on{fill:var(--rose)}.core{fill:var(--gold)}
  .screen{display:none}
  .screen.active{display:block;animation:fadeUp .35s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.screen.active{animation:none}}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;color:var(--ink-soft);font-size:14px;gap:10px}
  .card{background:var(--card);border-radius:var(--radius);padding:17px 16px;box-shadow:0 8px 26px rgba(61,39,51,.07);margin-top:12px}
  .sec-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--rose);margin-bottom:9px}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:7px}
  .rule{margin-top:10px;font-size:13px}
  .rule b{display:block}
  .rule span{color:var(--ink-soft)}
  .three{display:flex;gap:10px;margin-top:4px}
  .three div{flex:1;background:#FDF8F9;border-radius:14px;padding:10px 8px;text-align:center;font-size:12px;color:var(--ink-soft)}
  .three b{display:block;font-size:13.5px;color:var(--ink)}
  .optout{background:#EFF3EE;border-radius:18px;padding:15px 16px;margin-top:12px;font-size:13px}
  .optout b{display:block;font-size:12.5px;letter-spacing:.06em;color:var(--sage);text-transform:uppercase;margin-bottom:5px}
  .btn{display:block;margin-top:12px;width:100%;padding:14px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn.light{background:#EFE3E6;color:var(--ink)}
  .btn.soft{background:transparent;color:var(--ink-soft);font-weight:500;border:1.5px solid var(--line)}
  .btn.danger{background:transparent;color:var(--rose);border:1.5px solid var(--rose-soft)}
  .field{width:100%;border:1.5px solid var(--rose-soft);border-radius:13px;padding:11px 13px;font-size:16px;color:var(--ink);background:#fff;margin-top:6px}
  textarea.field{min-height:74px;font-size:14px;resize:vertical}
  .lbl{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin-top:14px}
  .lbl small{text-transform:none;letter-spacing:0;font-weight:500}
  /* дні */
  .daychips{display:flex;gap:8px;margin-top:12px}
  .dchip{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 4px;cursor:pointer;color:var(--ink-soft);text-align:center}
  .dchip b{display:block;font-size:14px;color:var(--ink)}
  .dchip small{font-size:11px}
  .dchip.on{border-color:var(--rose);background:#FDF6F8}
  .dchip.on b{color:var(--rose)}
  .dchip:disabled{opacity:.4;cursor:default}
  .entry{display:block;width:100%;text-align:left;background:#fff;border:none;border-radius:18px;padding:13px 14px;margin-top:9px;box-shadow:0 6px 18px rgba(61,39,51,.05);cursor:pointer;color:var(--ink)}
  .entry:disabled{cursor:default}
  .e-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .e-time{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;line-height:1}
  .e-kind{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rose)}
  .e-food{font-size:14px;margin-top:5px}
  .e-states{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.55}
  .empty{background:#fff;border-radius:18px;padding:22px 16px;margin-top:9px;text-align:center;color:var(--ink-soft);font-size:13px}
  .addbtn{display:block;width:100%;margin-top:12px;padding:15px;border:2px dashed var(--rose-soft);border-radius:18px;background:transparent;color:var(--rose);font-size:15px;font-weight:700;cursor:pointer}
  .banner{background:#F1E6DE;border-radius:14px;padding:12px 14px;font-size:12.8px;margin-top:12px}
  .banner.warn{background:var(--rose);color:#fff}
  .banner.soft{background:#EFF3EE}
  .linkbtn{background:none;border:none;color:var(--rose);font-weight:700;font-size:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:14px}
  /* форма */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 11px;font-size:13px;color:var(--ink);cursor:pointer}
  .chip.on{border-color:var(--rose);background:var(--rose);color:#fff}
  .sheet{position:fixed;inset:0;background:rgba(61,39,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .sheet.open{display:flex}
  .panel{background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:460px;max-height:92vh;overflow-y:auto}
  .panel-head{display:flex;justify-content:space-between;align-items:center}
  .panel-head h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
  .x{border:none;background:#fff;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink)}
  .row2{display:flex;gap:10px}
  .row2 > div{flex:1}
  /* підсумок */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:0 6px 18px rgba(61,39,51,.05)}
  .stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--rose);line-height:1}
  .stat span{font-size:10.8px;color:var(--ink-soft);line-height:1.25;display:block;margin-top:3px}
  .pattern{background:#fff;border-radius:18px;padding:14px 15px;margin-top:10px;box-shadow:0 6px 18px rgba(61,39,51,.05);border-left:5px solid var(--wheat)}
  .pattern.ok{border-left-color:var(--sage)}
  .pattern.care{border-left-color:var(--rose)}
  .pattern b{display:block;font-size:14px}
  .pattern p{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .pattern .next{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--rose);text-transform:uppercase}
  .freq{font-size:13px;line-height:1.8}
  .freq span{display:inline-block;background:#FDF6F8;border-radius:12px;padding:1px 9px;margin:2px 4px 2px 0}
  .footer-note{margin-top:18px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.5}
  /* навігація */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:10}
  .tabbar .inner{display:flex;gap:6px;max-width:460px;margin:0 auto}
  .tab{flex:1;border:none;background:none;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:6px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
  .tab .ic{font-size:18px}
  .tab.on{color:var(--rose);background:#FDF6F8}
  .toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:7px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:.94}
  .toast.bad{background:var(--rose)}
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="app">
  <div class="loading" id="loading">
    <svg width="72" height="72" viewBox="0 0 120 120" aria-hidden="true"><g id="lf"></g><circle class="core" cx="60" cy="60" r="11"/></svg>
    <p>Відкриваю щоденник…</p>
  </div>
  <section class="screen" id="s-welcome"></section>
  <section class="screen" id="s-skip"></section>
  <section class="screen" id="s-day"></section>
  <section class="screen" id="s-sum"></section>
  <section class="screen" id="s-more"></section>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <div class="inner">
    <button class="tab" data-tab="s-day" onclick="goToday()"><span class="ic">📓</span>Щоденник</button>
    <button class="tab" data-tab="s-sum" onclick="show('s-sum')"><span class="ic">🔎</span>Що я помітила</button>
    <button class="tab" data-tab="s-more" onclick="show('s-more')"><span class="ic">⚙️</span>Більше</button>
  </div>
</nav>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeForm()">
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="formTitle"></div>
</div>

<div class="sheet" id="copySheet" onclick="if(event.target===this)closeCopy()">
  <div class="panel">
    <div class="sec-title">Скопіюй вручну</div>
    <textarea class="field" id="copyText" readonly style="min-height:160px"></textarea>
    <div class="hint">Натисни на текст, утримуй — «Виділити все» → «Копіювати».</div>
    <button class="btn light" onclick="closeCopy()">Закрити</button>
  </div>
</div>

<script>
/* LOGIC-START */
const DAYS = 3;
const MAX_ENTRIES = 10;
const KINDS = {b:"Сніданок", l:"Обід", d:"Вечеря", s:"Перекус", w:"Напій"};
const BEFORE = {hun:"🍽 голод", tir:"😴 втома", bor:"🥱 нудьга", rus:"⏱ поспіх", str:"😣 напруга", sad:"😔 сум", joy:"🙂 гарний настрій", com:"👥 за компанію", tim:"⏰ бо час"};
const AFTER  = {ful:"😌 ситість", ple:"😊 задоволення", cal:"🙂 спокій", ene:"⚡ енергія", nth:"😐 нічого не змінилось", hev:"🪨 важкість", mor:"🔁 хочу ще", gui:"😕 провина"};
const HOW    = {tab:"🍽 за столом", run:"🏃‍♀️ на бігу", scr:"📱 перед екраном", std:"🧍‍♀️ стоячи"};
const EMO = ["tir","bor","str","sad"];
const KEYS = ["fd_settings","fd_d1","fd_d2","fd_d3","fd_reflect"];

function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dayNumber(startYmd, now){
  const s=parseYmd(startYmd), t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((t-s)/86400000)+1;
}
function dateOfDay(startYmd, n){ const s=parseYmd(startYmd); return new Date(s.getFullYear(),s.getMonth(),s.getDate()+(n-1)); }
function clampDay(n){ return Math.min(DAYS, Math.max(1, n)); }
function nowHM(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
function validHM(t){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t)); }
/* хвилини від 05:00 — щоб нічний перекус о 00:30 стояв ПІСЛЯ вечері */
function dayMinutes(t){ const p=t.split(":").map(Number); let m=p[0]*60+p[1]; if(m<300) m+=1440; return m; }
function isLate(t){ return validHM(t) && dayMinutes(t)>=1260; } /* 21:00–04:59 */
function guessKind(t){
  if(!validHM(t)) return "s";
  const m=dayMinutes(t);
  if(m<660) return "b";          /* до 11:00 */
  if(m<900) return "l";          /* 11:00–14:59 */
  if(m<1050) return "s";         /* 15:00–17:29 */
  if(m<1260) return "d";         /* 17:30–20:59 */
  return "s";
}
function pickCodes(arr, dict){
  if(!Array.isArray(arr)) return [];
  return Array.from(new Set(arr.filter(c=>dict[c]))).slice(0,2);
}
function normEntry(o){
  if(!o || typeof o!=="object") return null;
  const e={
    id: (typeof o.id==="string" && /^[a-z0-9]{1,12}$/.test(o.id)) ? o.id : Math.random().toString(36).slice(2,10),
    t: validHM(o.t) ? o.t : "12:00",
    k: KINDS[o.k] ? o.k : "s",
    f: typeof o.f==="string" ? o.f.trim().slice(0,120) : "",
    b: pickCodes(o.b, BEFORE),
    a: pickCodes(o.a, AFTER),
    h: HOW[o.h] ? o.h : ""
  };
  return (e.f || e.b.length || e.a.length) ? e : null;
}
function sortEntries(list){ return list.slice().sort((x,y)=>dayMinutes(x.t)-dayMinutes(y.t)); }
function emptyDay(){ return {e:[], n:""}; }
function normDay(o){
  const d=emptyDay();
  if(o && typeof o==="object"){
    if(Array.isArray(o.e)) d.e=sortEntries(o.e.map(normEntry).filter(Boolean)).slice(0,MAX_ENTRIES);
    if(typeof o.n==="string") d.n=o.n.slice(0,200);
  }
  return d;
}
function normSettings(o, now){
  const s={start: ymd(now), skipped:false};
  if(o && typeof o==="object"){
    if(/^\d{4}-\d{2}-\d{2}$/.test(o.start)) s.start=o.start;
    s.skipped = !!o.skipped;
  }
  return s;
}
function upsertEntry(day, entry){
  const e=normEntry(entry); if(!e) return {ok:false, why:"empty"};
  const i=day.e.findIndex(x=>x.id===e.id);
  if(i<0 && day.e.length>=MAX_ENTRIES) return {ok:false, why:"full"};
  const list=day.e.slice(); if(i>=0) list[i]=e; else list.push(e);
  day.e=sortEntries(list);
  return {ok:true, entry:e};
}
function removeEntry(day, id){ day.e=day.e.filter(x=>x.id!==id); }
function hm(mins){ const h=Math.floor(mins/60), m=mins%60; return h+" год"+(m?" "+m+" хв":""); }

function analyze(days){
  const r={entries:0, filledDays:0, lateStartDays:0, longestGap:0, longestGapDay:0, late:0, swingDays:0,
           emoBefore:0, emoSnacks:0, hungerBefore:0, auto:0, guilt:0, before:{}, after:{}};
  for(let n=1;n<=DAYS;n++){
    const d=days[n]; if(!d || !d.e.length) continue;
    r.filledDays++; r.entries+=d.e.length;
    const mins=d.e.map(x=>dayMinutes(x.t));
    const lateStart = mins[0]>=660;
    let gap=0;
    for(let i=1;i<mins.length;i++) gap=Math.max(gap, mins[i]-mins[i-1]);
    if(gap>r.longestGap){ r.longestGap=gap; r.longestGapDay=n; }
    const hasLate=d.e.some(x=>isLate(x.t));
    if(lateStart) r.lateStartDays++;
    if((lateStart || gap>300) && hasLate) r.swingDays++;
    d.e.forEach(x=>{
      if(isLate(x.t)) r.late++;
      const emo=x.b.some(c=>EMO.indexOf(c)>=0);
      if(emo) r.emoBefore++;
      if(emo && (x.k==="s" || isLate(x.t))) r.emoSnacks++;
      if(x.b.indexOf("hun")>=0) r.hungerBefore++;
      if(x.h==="run"||x.h==="scr"||x.h==="std") r.auto++;
      if(x.a.indexOf("gui")>=0) r.guilt++;
      x.b.forEach(c=>r.before[c]=(r.before[c]||0)+1);
      x.a.forEach(c=>r.after[c]=(r.after[c]||0)+1);
    });
  }
  return r;
}
function patterns(r){
  const out=[];
  if(!r.entries) return out;
  const gapTxt = r.longestGap>300 ? `Найдовша перерва — ${hm(r.longestGap)} (День ${r.longestGapDay}).` : "";
  if(r.swingDays>0) out.push({cls:"", t:"Голодний день → пізній вечір",
    p:`${r.swingDays===1?"Одного дня":r.swingDays+" дні"} був пізній старт або довга перерва — а потім записи після 21:00. ${gapTxt} Це не «слабкість увечері»: тіло добирає те, що недоотримало вдень.`,
    next:"Про це — День 6: стабільна енергія"});
  else if(r.longestGap>300) out.push({cls:"", t:"Найдовша перерва — "+hm(r.longestGap),
    p:`День ${r.longestGapDay}. Перерви понад 5 годин часто закінчуються вовчим голодом — і тоді вже не до вибору.`,
    next:"Спробуй: перекус із білком посередині"});
  if(r.emoBefore>=2) out.push({cls:"", t:"Їжа приходить і з емоцією",
    p:`${r.emoBefore} ${r.emoBefore<5?"рази":"разів"} перед їжею була втома, нудьга, напруга чи сум${r.emoSnacks && r.emoSnacks<r.emoBefore?` (з них ${r.emoSnacks} — перекуси чи пізній вечір)`:""}. Це не провал — це знахідка: тепер видно, коли їжа працює як заспокійливе.`,
    next:"День 5: «Стоп-пауза»"});
  if(r.auto>=3) out.push({cls:"", t:"Їжа на автоматі",
    p:`${r.auto} записів — на бігу, стоячи чи перед екраном. Так тіло часто не встигає помітити ситість.`,
    next:"Спробуй один прийом за столом, без екрана"});
  if(r.guilt>0) out.push({cls:"care", t:"Провина після їжі",
    p:"Провина — сигнал не про їжу, а про правила в голові: «можна» і «не можна». Саме їх ми розбиратимемо в День 6."
      + (r.guilt>=3 ? " Якщо провина приходить часто і важко — це варто обговорити з фахівцем особисто. А щоденник можна зупинити будь-коли." : ""),
    next:"День 6: їжа без заборон"});
  if(!out.length) out.push({cls:"ok", t:"Яскравих патернів не видно 🌿",
    p: r.hungerBefore>=Math.ceil(r.entries/2)
      ? "Ти здебільшого їси з голоду — тіло і ти на одній хвилі. Просто перечитай записи добрим поглядом: що тобі в них подобається?"
      : "Перечитай записи добрим поглядом: можливо, ти помітиш щось своє, чого не вловить жоден алгоритм.",
    next:""});
  return out;
}
function topList(freq, dict, n){
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,n).map(c=>dict[c]+" ×"+freq[c]);
}
function diaryText(days, s){
  const out=["Мій харчовий щоденник · Розквітай"];
  for(let n=1;n<=DAYS;n++){
    const d=days[n]; if(!d || (!d.e.length && !d.n.trim())) continue;
    const dt=dateOfDay(s.start,n);
    out.push("", "День "+n+" · "+pad(dt.getDate())+"."+pad(dt.getMonth()+1));
    d.e.forEach(x=>{
      const st=[];
      if(x.b.length) st.push("до: "+x.b.map(c=>BEFORE[c].replace(/^\S+ /,"")).join(", "));
      if(x.a.length) st.push("після: "+x.a.map(c=>AFTER[c].replace(/^\S+ /,"")).join(", "));
      if(x.h) st.push(HOW[x.h].replace(/^\S+ /,""));
      out.push(x.t+" "+KINDS[x.k]+(x.f?" — "+x.f:"")+(st.length?" ("+st.join("; ")+")":""));
    });
    if(d.n.trim()) out.push("Помітила: "+d.n.trim());
  }
  return out.length>1 ? out.join("\n") : "";
}

/* Сховище: Telegram CloudStorage → браузер → лише пам'ять */
function makeStore(win){
  const tg = win.Telegram && win.Telegram.WebApp;
  let ls=null;
  try{ const k="fd_test"; win.localStorage.setItem(k,"1"); win.localStorage.removeItem(k); ls=win.localStorage; }catch(e){ ls=null; }
  const tgOk = !!(tg && tg.initData && tg.CloudStorage && typeof tg.isVersionAtLeast==="function" && tg.isVersionAtLeast("6.9"));
  const mode = tgOk ? "telegram" : (ls ? "local" : "memory");
  const mem={};
  const lsGet=k=>{ try{ return ls ? ls.getItem(k) : (k in mem ? mem[k] : null); }catch(e){ return null; } };
  const lsSet=(k,v)=>{ mem[k]=v; try{ if(ls) ls.setItem(k,v); }catch(e){} };
  const lsDel=k=>{ delete mem[k]; try{ if(ls) ls.removeItem(k); }catch(e){} };
  return {
    mode,
    getAll(keys){
      return new Promise(res=>{
        const fromLocal=()=>{ const out={}; keys.forEach(k=>out[k]=lsGet(k)); return out; };
        if(mode!=="telegram"){ res(fromLocal()); return; }
        try{
          tg.CloudStorage.getItems(keys,(err,vals)=>{
            if(err || !vals){ res(fromLocal()); return; }
            const out={};
            keys.forEach(k=>{ const v=vals[k]; out[k]=(v===undefined||v===null||v==="") ? lsGet(k) : v; });
            res(out);
          });
        }catch(e){ res(fromLocal()); }
      });
    },
    set(k,v){
      return new Promise(res=>{
        lsSet(k,v);
        if(mode!=="telegram"){ res(mode==="local"); return; }
        try{ tg.CloudStorage.setItem(k,v,(err)=>res(!err)); }catch(e){ res(false); }
      });
    },
    removeAll(keys){
      return new Promise(res=>{
        keys.forEach(lsDel);
        if(mode!=="telegram"){ res(true); return; }
        try{ tg.CloudStorage.removeItems(keys,(err)=>res(!err)); }catch(e){ res(false); }
      });
    }
  };
}
/* LOGIC-END */

  for(let i=1;i<=DAYS;i++){ let o=null; try{ o=vals["fd_d"+i]?JSON.parse(vals["fd_d"+i]):null; }catch(e){} days[i]=normDay(o); }

function stateLine(x){
  const parts=[];
  if(x.b.length) parts.push("до: "+x.b.map(c=>BEFORE[c]).join(", "));
  if(x.a.length) parts.push("після: "+x.a.map(c=>AFTER[c]).join(", "));
  if(x.h) parts.push(HOW[x.h]);
  return parts.join(" · ");
}

function pickChip(group, code){
  haptic();

  else if(group==="h") draft.h = draft.h===code ? "" : code;
  else {
    const arr=draft[group], i=arr.indexOf(code);
    if(i>=0) arr.splice(i,1); else { arr.push(code); if(arr.length>2) arr.shift(); }
  }
  const food=$("fFood") ? $("fFood").value : draft.f; draft.f=food;
  const y=$("panel").scrollTop; renderForm(); $("panel").scrollTop=y;

    <div class="card"><div class="sec-title">Де живуть мої записи</div><div style="font-size:13px">${storageText()}</div></div>
    <div class="card"><div class="sec-title">Чотири чесні правила</div>${rulesHtml()}</div>
    <div class="optout"><b>Якщо щоденник почав тривожити</b>
      Зупинитися можна в будь-який момент — це турбота, а не провал. Твого трекера і спостережень повністю достатньо.
      <button class="btn soft" id="stopBtn" style="background:#fff" onclick="stopDiary()">Зупинити щоденник і видалити записи</button>
    </div>
    <div class="card"><div class="sec-title">Почати заново</div>
      <div style="font-size:13px">Нові 3 дні з сьогоднішнього дня. Поточні записи зникнуть.</div>
      <button class="btn danger" id="resetBtn" onclick="resetDiary()">Почати заново</button>
    </div>
    <p class="footer-note">${DISCLAIMER}</p>`;
}
async function wipe(){
  await store.removeAll(KEYS);
  for(let i=1;i<=DAYS;i++) days[i]=emptyDay(); reflect="";
}
async function stopDiary(){
  const b=$("stopBtn");
  if(!stopArmed){ stopArmed=true; b.textContent="Натисни ще раз — записи буде видалено"; setTimeout(()=>{ stopArmed=false; if($("stopBtn")) $("stopBtn").textContent="Зупинити щоденник і видалити записи"; },4000); return; }
  stopArmed=false;
  await wipe();
  settings=normSettings({start: ymd(new Date()), skipped:true}, new Date());
  await store.set("fd_settings", JSON.stringify(settings));
  renderSkip(); show("s-skip");
}
async function resetDiary(){
  const b=$("resetBtn");
  if(!resetArmed){ resetArmed=true; b.textContent="Точно? Натисни ще раз"; setTimeout(()=>{ resetArmed=false; if($("resetBtn")) $("resetBtn").textContent="Почати заново"; },4000); return; }
  resetArmed=false;
  await wipe();
  settings=null;
  renderWelcome(); show("s-welcome");
}

/* ---------- копіювання ---------- */
function copyText(text, okMsg){
  if(!text.trim()){ toast("Поки нічого копіювати", false); return; }
  const manual=()=>{ $("copyText").value=text; $("copySheet").classList.add("open"); };
  const fallback=()=>{
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta);
    if(ok) toast(okMsg,true); else manual();
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(()=>toast(okMsg,true)).catch(fallback);
  else fallback();
}
function closeCopy(){ $("copySheet").classList.remove("open"); }
